# Build the editor for Windows and macOS on every push, and keep one rolling
# `latest` release holding the newest of each.
#
# Two things are built: the engine, which is C (the `engine` submodule, built
# at the commit this repository names), and the editor around it, which is
# Python packaged with PyInstaller. Microsoft's voice files are in neither and
# are not on these machines either, so what is checked here is everything that
# needs no voice: the engine builds and loads, the tests pass -- the ones that
# sing skip themselves -- and the packaged program starts and finds its engine.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # the rolling release is written by this workflow

# One build at a time: two pushes in quick succession would otherwise race to
# move the same tag, and the loser would publish the older commit.
concurrency:
  group: rolling-build
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false       # a broken macOS build should not hide Windows
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: WhistlerStudio-win64
          - os: macos-14     # Apple Silicon
            label: macos
            asset: WhistlerStudio-macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true       # the engine

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy setuptools wxPython pyinstaller

      # The Windows runners carry MSYS2's mingw-w64 GCC but do not put it on
      # the path. Without it, tools/build_engine.py uses Visual Studio, which
      # the runners also have. Clang on macOS needs nothing.
      - name: Find MinGW (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in /c/msys64/mingw64/bin /c/msys64/ucrt64/bin /c/ProgramData/mingw64/mingw64/bin /c/mingw64/bin; do
            if [ -x "$d/gcc.exe" ]; then echo "$d" >> "$GITHUB_PATH"; echo "gcc: $d"; exit 0; fi
          done
          echo "no MinGW here; the engine will be built with Visual Studio"

      - name: Build the engine
        run: python tools/build_engine.py

      - name: The engine must load
        shell: bash
        run: |
          python - <<'PY'
          from whistler import libsam, paths
          assert libsam.available(), libsam.REASON
          print(libsam.describe())
          print('voices here:', paths.find_voices().names() or 'none, as expected')
          PY

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Package
        run: pyinstaller --noconfirm WhistlerStudio.spec

      # The only check that runs what is actually being shipped. With no
      # voices on this machine it cannot sing, but it can say which engine it
      # is carrying, which it can only do if the library went into the build
      # under the name the program looks for and loads from there.
      - name: The packaged program must find its engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ws="dist/WhistlerStudio/whistler.exe"
          else
            ws="dist/Whistler Studio.app/Contents/MacOS/WhistlerStudio"
          fi
          "$ws" --version | tee version.txt
          grep -q "Microsoft Sam, Mike and Mary" version.txt

      # The guide goes beside the program rather than inside it, so that
      # someone who unzips the folder can read it without running anything.
      - name: Zip it up (Windows)
        if: runner.os == 'Windows'
        run: |
          cp docs/read-me.txt "dist/WhistlerStudio/Read Me.txt"
          cd dist
          7z a -tzip ${{ matrix.asset }}.zip WhistlerStudio

      # ditto with the resource forks and the executable bit left alone, which
      # is why this is `ditto` and not `zip`
      - name: Zip it up (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          mkdir -p "Whistler Studio"
          mv "Whistler Studio.app" "Whistler Studio/"
          cp ../docs/read-me.txt "Whistler Studio/Read Me.txt"
          ditto -c -k --sequesterRsrc --keepParent "Whistler Studio" ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: rolling latest release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Move the rolling release to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes=$(mktemp)
          {
            printf 'Built from %s on %s.\n\n' \
              "$(git rev-parse --short HEAD)" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '%s\n\n' "$(git log -1 --pretty=%s)"
            cat .github/rolling-release.md
          } > "$notes"
          # `gh release edit` cannot move a tag, so the release is replaced.
          # Deleting it takes the tag with it, and a fresh one is made against
          # this commit.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest builds/*.zip \
            --title "Latest build" \
            --notes-file "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
